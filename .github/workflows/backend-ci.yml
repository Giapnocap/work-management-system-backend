name: Backend CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MSSQL_SA_PASSWORD: CiOnlyStrongPassword123!
      JWT_KEY: CiOnlyJwtSigningKeyAtLeast32CharactersLong123
      DEMO_SEED_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: >-
          dotnet restore WorkManagementSystem.sln
          -p:NuGetAuditMode=all
          -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904

      - name: Verify formatting
        run: dotnet format WorkManagementSystem.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build WorkManagementSystem.sln --configuration Release --no-restore --warnaserror

      - name: Unit and HTTP integration tests
        run: >-
          dotnet test WorkManagementSystem.sln
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=SqlServer"
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults

      - name: Start SQL Server for relational tests
        run: >-
          docker compose up
          --detach
          --wait
          --wait-timeout 180
          sqlserver

      - name: SQL Server integration tests
        env:
          WMS_TEST_SQLSERVER_CONNECTION: Server=localhost,14333;Database=master;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True
        run: >-
          dotnet test WorkManagementSystem.Tests/WorkManagementSystem.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "Category=SqlServer"
          --logger "trx;LogFileName=sqlserver-integration-tests.trx"
          --results-directory TestResults

      - name: Verify migration model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --configuration Release
          --no-build

      - name: Publish
        run: >-
          dotnet publish WorkManagementSystem.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/publish
          -p:UseAppHost=false

      - name: Validate Docker Compose
        run: docker compose -f compose.yml config --quiet

      - name: Build container stack
        run: docker compose build api migrate

      - name: Start SQL Server, migrate and API
        run: docker compose up --detach --no-build

      - name: Verify container HTTP workflow
        shell: bash
        run: |
          set -euo pipefail

          login() {
            local username="$1"
            local response
            local token

            response="$(
              curl --fail-with-body --silent --show-error \
                --header "Content-Type: application/json" \
                --data "{\"username\":\"${username}\",\"password\":\"Demo@123456\"}" \
                http://localhost:8080/api/auth/login
            )"

            if token="$(jq --exit-status --raw-output \
              'select(type == "string" and length > 0)' \
              <<< "$response" 2> /dev/null)"; then
              :
            else
              token="$response"
            fi

            if [[ ! "$token" =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
              echo "Login response must contain a valid JWT access token." >&2
              return 1
            fi

            printf '%s' "$token"
          }

          assert_non_empty_array() {
            local label="$1"
            local token="$2"
            local url="$3"
            local response_file
            response_file="$(mktemp)"

            curl --fail-with-body --silent --show-error \
              --output "$response_file" \
              --header "Authorization: Bearer $token" \
              "$url"

            if ! jq --exit-status \
              'if type == "array" then length > 0 else false end' \
              "$response_file" > /dev/null; then
              echo "$label did not return a non-empty JSON array."
              cat "$response_file"
              exit 1
            fi
          }

          for attempt in {1..30}; do
            if curl --fail-with-body --silent --show-error \
              http://localhost:8080/health/ready > /tmp/ready.txt; then
              break
            fi

            if [[ "$attempt" == "30" ]]; then
              echo "API readiness check timed out."
              exit 1
            fi

            sleep 2
          done

          grep -q "Healthy" /tmp/ready.txt

          api_container="$(docker compose ps --quiet api)"
          test -n "$api_container"
          for attempt in {1..30}; do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' "$api_container")"
            if [[ "$health_status" == "healthy" ]]; then
              break
            fi

            if [[ "$health_status" == "unhealthy" || "$attempt" == "30" ]]; then
              echo "API container health status: $health_status"
              exit 1
            fi

            sleep 2
          done

          ADMIN_TOKEN="$(login demo.admin)"
          MANAGER_TOKEN="$(login demo.manager)"
          USER_TOKEN="$(login demo.employee1)"

          assert_non_empty_array \
            "KPI periods endpoint" \
            "$ADMIN_TOKEN" \
            "http://localhost:8080/api/kpi-periods"

          assert_non_empty_array \
            "Projects endpoint" \
            "$MANAGER_TOKEN" \
            "http://localhost:8080/api/projects"

          user_create_status="$(
            curl --silent --output /tmp/user-create.json --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $USER_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"name":"Forbidden project"}' \
              http://localhost:8080/api/projects
          )"
          test "$user_create_status" = "403"

          anonymous_status="$(
            curl --silent --output /tmp/anonymous.json --write-out "%{http_code}" \
              http://localhost:8080/api/projects
          )"
          test "$anonymous_status" = "401"

      - name: Verify SQL migration and demo seed
        shell: bash
        run: |
          set -euo pipefail
          sql_container="$(docker compose ps --quiet sqlserver)"

          docker exec "$sql_container" bash -c '
            sqlcmd="/opt/mssql-tools18/bin/sqlcmd"
            if [[ ! -x "$sqlcmd" ]]; then
              sqlcmd="/opt/mssql-tools/bin/sqlcmd"
            fi

            if [[ ! -x "$sqlcmd" ]]; then
              echo "sqlcmd was not found in the SQL Server container."
              exit 1
            fi

            migration_count="$(
              "$sqlcmd" -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -h -1 -W \
                -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM WorkManagementDB.dbo.__EFMigrationsHistory;"
            )"
            latest_migration="$(
              "$sqlcmd" -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -h -1 -W \
                -Q "SET NOCOUNT ON; SELECT TOP (1) MigrationId FROM WorkManagementDB.dbo.__EFMigrationsHistory ORDER BY MigrationId DESC;"
            )"
            user_count="$(
              "$sqlcmd" -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -h -1 -W \
                -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM WorkManagementDB.dbo.Users;"
            )"
            project_count="$(
              "$sqlcmd" -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -h -1 -W \
                -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM WorkManagementDB.dbo.Projects;"
            )"
            kpi_period_count="$(
              "$sqlcmd" -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -h -1 -W \
                -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM WorkManagementDB.dbo.KpiPeriods;"
            )"

            test "$migration_count" -eq 40
            test "$latest_migration" = "20260809055810_StoreUploadStorageKeys"
            test "$user_count" -eq 4
            test "$project_count" -gt 0
            test "$kpi_period_count" -gt 0
          '

      - name: Verify liveness is independent from SQL Server
        shell: bash
        run: |
          set -euo pipefail
          docker compose stop sqlserver

          for attempt in {1..6}; do
            live_status="$(
              curl --silent --output /tmp/live-after-sql-stop.txt --write-out "%{http_code}" \
                http://localhost:8080/health/live
            )"
            ready_status="$(
              curl --silent --output /tmp/ready-after-sql-stop.txt --write-out "%{http_code}" \
                http://localhost:8080/health/ready
            )"

            if [[ "$live_status" == "200" && "$ready_status" == "503" ]]; then
              exit 0
            fi

            if [[ "$attempt" == "6" ]]; then
              echo "Expected live=200 and ready=503; got live=$live_status ready=$ready_status."
              exit 1
            fi

            sleep 2
          done

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop container stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: work-management-backend
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 14
